get:
  tags:
    - Venues
  summary: Get venue
  description: >
    Get an individual venue by ID.


    Requires the `read` scope for applications created on or after 2026-11-01. See [Scopes](#section/Authentication/Scopes).
  operationId: getVenue
  parameters:
    - in: path
      name: venue_id
      schema:
        type: string
        description: The ID of the venue
    - $ref: "../components/parameters/PVVersion.yaml"
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            oneOf:
              - title: Default
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                  data:
                    $ref: "../components/schemas/Venue.yaml"
              - title: PV-Version 2026-11-01
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "../components/schemas/Venue.yaml"
    '400':
      $ref: "../components/responses/BadRequest.yaml"
    '401':
      $ref: "../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../components/responses/Forbidden.yaml"
    '404':
      $ref: "../components/responses/NotFound.yaml"
    '429':
      $ref: "../components/responses/TooManyRequests.yaml"
