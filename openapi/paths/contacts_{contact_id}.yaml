get:
  tags:
    - Contacts
  summary: Get contact
  description: >
    Get an individual contact by ID.


    Requires the `read` scope for applications created on or after 2026-11-01. See [Scopes](#section/Authentication/Scopes).
  operationId: getContact
  parameters:
    - in: path
      name: contact_id
      schema:
        type: string
        description: The ID of the contact
    - $ref: "../components/parameters/PVVersion.yaml"
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            oneOf:
              - title: Default
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                  data:
                    $ref: "../components/schemas/Contact.yaml"
              - title: PV-Version 2026-11-01
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "../components/schemas/Contact.yaml"
    '401':
      $ref: "../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../components/responses/Forbidden.yaml"
    '404':
      $ref: "../components/responses/NotFound.yaml"
    '429':
      $ref: "../components/responses/TooManyRequests.yaml"

put:
  tags:
    - Contacts
  summary: Update contact
  description: >
    Update an individual contact by ID.


    Requires the `write` scope for applications created on or after 2026-11-01. See [Scopes](#section/Authentication/Scopes).
  operationId: updateContact
  parameters:
    - in: path
      name: contact_id
      schema:
        type: string
        description: The ID of the contact
    - $ref: "../components/parameters/PVVersion.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - contact
          properties:
            contact:
              $ref: "../components/schemas/UpdateContactInput.yaml"
        examples:
          update_contact:
            summary: Update a contact email and phone
            value:
              contact:
                email: ada.updated@example.com
                phone: "+14155550101"
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            oneOf:
              - title: Default
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                  data:
                    $ref: "../components/schemas/Contact.yaml"
              - title: PV-Version 2026-11-01
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "../components/schemas/Contact.yaml"
    '400':
      $ref: "../components/responses/BadRequest.yaml"
    '401':
      $ref: "../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../components/responses/Forbidden.yaml"
    '404':
      $ref: "../components/responses/NotFound.yaml"
    '429':
      $ref: "../components/responses/TooManyRequests.yaml"
