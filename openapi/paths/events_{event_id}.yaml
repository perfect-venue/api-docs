get:
  tags:
    - Events
  summary: Get event
  description: >
    Get an individual event by ID.


    Requires the `read` scope for applications created on or after 2026-11-01. See [Scopes](#section/Authentication/Scopes).
  operationId: getEvent
  parameters:
    - in: path
      name: event_id
      schema:
        type: string
        description: The ID of the event
    - $ref: "../components/parameters/PVVersion.yaml"
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            oneOf:
              - title: Default
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                  data:
                    $ref: "../components/schemas/Event.yaml"
              - title: PV-Version 2026-11-01
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "../components/schemas/Event.yaml"
    '400':
      $ref: "../components/responses/BadRequest.yaml"
    '401':
      $ref: "../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../components/responses/Forbidden.yaml"
    '404':
      $ref: "../components/responses/NotFound.yaml"
    '429':
      $ref: "../components/responses/TooManyRequests.yaml"

patch:
  tags:
    - Events
  summary: Update event
  description: >
    Update an individual event by ID.


    Requires the `write` scope for applications created on or after 2026-11-01. See [Scopes](#section/Authentication/Scopes).
  operationId: updateEvent
  parameters:
    - in: path
      name: event_id
      schema:
        type: string
        description: The ID of the event
    - $ref: "../components/parameters/PVVersion.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - event
          properties:
            event:
              $ref: "../components/schemas/UpdateEventInput.yaml"
        examples:
          update_event:
            summary: Update event timing and guest count
            value:
              event:
                start_time: "2026-08-15T19:00:00Z"
                end_time: "2026-08-16T00:00:00Z"
                group_size: 140
                amount: 175000
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            oneOf:
              - title: Default
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                  data:
                    $ref: "../components/schemas/Event.yaml"
              - title: PV-Version 2026-11-01
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "../components/schemas/Event.yaml"
    '400':
      $ref: "../components/responses/BadRequest.yaml"
    '401':
      $ref: "../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../components/responses/Forbidden.yaml"
    '404':
      $ref: "../components/responses/NotFound.yaml"
    '429':
      $ref: "../components/responses/TooManyRequests.yaml"
