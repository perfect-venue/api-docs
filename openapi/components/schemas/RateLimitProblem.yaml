type: object
description: Rate limit error body. Every version returns this format.
required:
  - type
  - title
  - status
  - detail
  - request_id
properties:
  type:
    type: string
    format: uri
    example: https://docs.perfectvenue.com/lead-form-api/errors/rate-limited
  title:
    type: string
    example: Rate limit exceeded
  status:
    type: integer
    enum: [429]
  detail:
    type: string
    example: You have exceeded 100 requests per minute. Try again in 42 seconds.
  request_id:
    type: string
    description: Matches the `X-Request-Id` response header
    example: 9f6c2b0e-4a1d-4c55-8a3e-2f7d1c9b6a10
